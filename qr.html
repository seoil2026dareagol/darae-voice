<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR 인쇄용</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=East+Sea+Dokdo&family=Gowun+Dodum&display=swap">
<style>
  * { box-sizing: border-box; }
  body { font-family: "Gowun Dodum", "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 20px; background: #e6ddd4; color: #28140c;
    -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  h1 { font-family: "East Sea Dokdo", cursive; font-weight: 400; font-size: 2.4rem; margin: 0 0 4px; color: #531206; }
  p.hint { margin: 0 0 18px; font-size: .85rem; color: #6b5548; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 16px; }
  .qr { background: #f6f1ea; border: 1px solid #c9bcae; padding: 18px 14px 14px; text-align: center; break-inside: avoid;
    display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .qr .play { font-size: .72rem; letter-spacing: .08em; color: #6b5548; }
  .qr b { font-family: "East Sea Dokdo", cursive; font-weight: 400; font-size: 2rem; line-height: 1.1; color: #531206; white-space: nowrap; }
  .qr .code { padding: 0; background: #f6f1ea; line-height: 0; margin: 4px 0; }
  .qr .code svg { display: block; width: 150px; height: 150px; }
  .qr small { font-size: .78rem; color: #a80808; }
  @media print { body { background: #fff; padding: 0; } h1, p.hint { display: none; } .grid { gap: 10px; } }
</style>
</head>
<body>
<h1>배우에게 한마디 QR</h1>
<p class="hint">브라우저의 인쇄(Ctrl+P / ⌘P)로 뽑거나 화면을 캡처해 쓰세요. 인쇄할 때는 "배경 그래픽"을 켜 주세요. 각 카드를 잘라 캐스팅보드의 배우 사진 옆에 붙입니다.</p>
<div class="grid" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
var C = window.CONFIG, g = document.getElementById("g");
function qrSvg(text) {
  var tmp = document.createElement("div");
  var q = new QRCode(tmp, { text: text, width: 10, height: 10, correctLevel: QRCode.CorrectLevel.M });
  var m = q._oQRCode, n = m.getModuleCount(), Q = 2, size = n + Q * 2;
  var INK = "#531206", RED = "#a80808", out = "";
  function inFinder(r, c) { return (r < 7 && c < 7) || (r < 7 && c >= n - 7) || (r >= n - 7 && c < 7); }
  for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
    if (!m.isDark(r, c) || inFinder(r, c)) continue;
    out += '<circle cx="' + (c + Q + .5) + '" cy="' + (r + Q + .5) + '" r=".44" fill="' + INK + '"/>';
  }
  [[0, 0], [0, n - 7], [n - 7, 0]].forEach(function (p) {
    var x = p[1] + Q, y = p[0] + Q;
    out += '<rect x="' + (x + .5) + '" y="' + (y + .5) + '" width="6" height="6" rx="1.9" fill="none" stroke="' + INK + '" stroke-width="1"/>' +
           '<rect x="' + (x + 2) + '" y="' + (y + 2) + '" width="3" height="3" rx="1.1" fill="' + RED + '"/>';
  });
  return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + size + ' ' + size + '" width="150" height="150" shape-rendering="geometricPrecision">' +
    '<rect width="' + size + '" height="' + size + '" fill="#f6f1ea"/>' + out + '</svg>';
}

C.ACTORS.map(function (a, i) { return { a: a, no: i + 1 }; })
  .sort(function (x, y) { return x.a.localeCompare(y.a, "ko"); })
  .forEach(function (it) {
  var a = it.a, url = C.SITE_URL + "/?a=" + it.no;
  var d = document.createElement("div"); d.className = "qr";
  var p = document.createElement("span"); p.className = "play"; p.textContent = "〈" + C.PLAY + "〉";
  var b = document.createElement("b"); b.textContent = a + (a === "강채원" ? " 연출님께" : " 배우님께");
  var code = document.createElement("div"); code.className = "code";
  var s = document.createElement("small"); s.textContent = "QR을 찍고 한마디 남기기";
  d.appendChild(p); d.appendChild(b); d.appendChild(code); d.appendChild(s); g.appendChild(d);
  code.innerHTML = qrSvg(url);
});
</script>
</body>
</html>

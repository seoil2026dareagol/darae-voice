<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>QR 인쇄용</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&display=swap">
<style>
  body { font-family: "Gaegu", "Apple SD Gothic Neo", sans-serif; margin: 0; padding: 16px; background: #fff; color: #222; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  p.hint { margin: 0 0 16px; font-family: sans-serif; font-size: .85rem; color: #555; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
  .qr { border: 2px dashed #999; padding: 12px; text-align: center; break-inside: avoid; }
  .qr .code { display: flex; justify-content: center; margin-bottom: 6px; }
  .qr b { font-size: 1.5rem; display: block; }
  .qr small { font-family: sans-serif; font-size: .7rem; color: #666; }
  @media print { p.hint { display: none; } }
</style>
</head>
<body>
<h1>배우에게 한마디 QR</h1>
<p class="hint">브라우저의 인쇄(Ctrl+P / ⌘P)로 뽑거나 화면을 캡처해 쓰세요. 각 QR을 잘라 캐스팅보드의 배우 사진 옆에 붙입니다.</p>
<div class="grid" id="g"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="config.js"></script>
<script>
var C = window.CONFIG, g = document.getElementById("g");
C.ACTORS.forEach(function (a, i) {
  var url = C.SITE_URL + "/index.html?a=" + (i + 1);
  var d = document.createElement("div"); d.className = "qr";
  var code = document.createElement("div"); code.className = "code";
  var b = document.createElement("b"); b.textContent = a + " 배우님께";
  var s = document.createElement("small"); s.textContent = "한마디 남기기";
  d.appendChild(code); d.appendChild(b); d.appendChild(s); g.appendChild(d);
  new QRCode(code, { text: url, width: 150, height: 150, correctLevel: QRCode.CorrectLevel.M });
});
</script>
</body>
</html>
